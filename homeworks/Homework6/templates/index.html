<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <div class="chat-header-info">
                <h1>AI Chatbot</h1>
                <span class="status-indicator">
                    <span class="status-dot"></span>
                    <span class="status-text">Online</span>
                </span>
            </div>
            <p class="welcome-message">Welcome! Type a message below to start chatting.</p>
        </header>

        <main id="chat-messages" class="chat-messages">
            <div class="message assistant">
                <div class="message-bubble">
                    Hello! I am your AI Chatbot assistant. How can I help you today?
                </div>
            </div>
        </main>

        <footer class="chat-footer">
            <form id="chat-form" class="chat-input-form" onsubmit="return false;">
                <input
                    type="text"
                    id="user-input"
                    class="chat-input"
                    placeholder="Type your message here..."
                    autocomplete="off"
                    aria-label="User message"
                />
                <button type="submit" id="send-btn" class="send-button" aria-label="Send message">
                    <span>Send</span>
                    <svg class="send-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </form>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
